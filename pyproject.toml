[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-foundry"
version = "0.1.0"
description = "A stdlib-first Retrieval-Augmented Generation pipeline: hybrid BM25 + hashed-vector retrieval, citation-enforced answers, and LLM-judge evaluation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sajjad" }]
keywords = [
    "rag",
    "retrieval",
    "retrieval-augmented-generation",
    "bm25",
    "rrf",
    "llm",
    "nlp",
    "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ragf = "rag_foundry.cli:main"

[project.urls]
Homepage = "https://github.com/Sunyiad/rag-foundry"
Repository = "https://github.com/Sunyiad/rag-foundry"
Issues = "https://github.com/Sunyiad/rag-foundry/issues"

[tool.setuptools.packages.find]
include = ["rag_foundry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
